# BT Stack configuration (cmake-level, supplements defconfig)
set(CONFIG_BT_BREDR y)
set(CONFIG_BT_SDP y)
set(CONFIG_BT_L2CAP_DYNAMIC_CHANNEL y)
set(CONFIG_BT_MAX_CONN 2)
set(CONFIG_BT_DEVICE_NAME "DS4Dongle")
set(CONFIG_BT_DEVICE_NAME_DYNAMIC y)
set(CONFIG_BT_SMP y)
set(CONFIG_BT_SSP y)
set(CONFIG_BT_BONDABLE y)
set(CONFIG_BT_SETTINGS y)
set(CONFIG_BT_KEYS_OVERWRITE_OLDEST y)
set(CONFIG_BT_L2CAP_BR_SERVER y)

# Disable BT profiles we don't use
set(CONFIG_BT_A2DP n)
set(CONFIG_BT_AVRCP n)
set(CONFIG_BT_HFP n)
set(CONFIG_BT_STACK_CLI n)

# Link-Time Optimization
set(CONFIG_GCC_COMPILE_LTO y)

# L2CAP TX MTU: must be >= the 462-byte DS4 audio report (0x17). Default 247
# is too small, which makes every speaker report fail with -EMSGSIZE.
set(CONFIG_BT_L2CAP_TX_MTU 672)

# USB is Full-Speed only (12 Mbps). CONFIG_USB_HS must stay unset here:
# CMakeLists.txt drops any inherited value and fails the configure if it
# reappears. Do not add set(CONFIG_USB_HS ...) back.

# CherryUSB device audio class (UAC1, DS4 speaker/mic interfaces)
set(CONFIG_CHERRYUSB_DEVICE_AUDIO 1)

# No CDC-ACM class: the CDC console was removed. Set explicitly to off so a
# stale CMakeCache entry from an older build cannot pull the class back in.
set(CONFIG_CHERRYUSB_DEVICE_CDC_ACM n)

